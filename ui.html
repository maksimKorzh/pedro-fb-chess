<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>FB Chess Client</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/chessboard-1.0.0.css">
    </head>
    <body>
        <div id="chessboard"></div>
        <div id="panel">
            
            <!-- Row 1: Player avatars and names -->
    <div id="players">

        <div class="player" id="white-player">
            <div class="player-info">
                <div id="white-avatar" class="avatar"></div>
                <span id="white-name">White Player</span>
            </div>
        </div>

        <div class="player" id="black-player">
            <div class="player-info">
                <div id="black-avatar" class="avatar"></div>
                <span id="black-name">Black Player</span>
            </div>
        </div>

    </div>

    <!-- Row 2: Countdown and clocks -->
    <div id="clocks">

        <div class="clock-group" id="white-clocks">
            <div class="clock-item">
                <span class="clock-label">Countdown</span>
                <span id="white-countdown" class="clock-value">00:00</span>
            </div>

            <div class="clock-item">
                <span class="clock-label">Clock</span>
                <span id="white-clock" class="clock-value">00:00</span>
            </div>
        </div>

        <div class="clock-group" id="black-clocks">
            <div class="clock-item">
                <span class="clock-label">Countdown</span>
                <span id="black-countdown" class="clock-value">00:00</span>
            </div>

            <div class="clock-item">
                <span class="clock-label">Clock</span>
                <span id="black-clock" class="clock-value">00:00</span>
            </div>
        </div>

    </div>
            
            
            
            
            
            <button style="height: 40px; font-size: 20px;" id="stockfish">Ask Stockfish for a move</button>
            <pre id="output" style="width: ` + (window.innerWidth - canvas.width-34) + `px; height: ` + (canvas.width-58) + `px; font-family: monospace; font-size: calc(100vw/113); overflow: auto;"></pre>
            <input id="input" spellcheck="false" placeholder="Type a command..." style="width: ` + (window.innerWidth - canvas.width-34) + `px; font-size: 18px;" autofocus>
        </div>
        <script src="js/jquery-3.7.1.min.js"></script>
        <script src="js/chessboard-1.0.0.js"></script>
        <script src="js/chess.min.js"></script>
        <script src="js/ui.js"></script>
    </body>
</html>
