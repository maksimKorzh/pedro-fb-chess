
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournaments</title>
    <link rel="stylesheet" href="css/lobby.css">

    <style>
        .tournaments {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            gap: var(--gap);
        }

        /* NAVIGATION */

        .tournament-tabs {
            display: flex;
            gap: 8px;
            flex: 0 0 auto;
        }

        .tournament-tabs button {
            flex: 1;
            min-width: 0;
            min-height: 44px;
            padding: 8px;
        }

        .tournament-tabs button.active {
            background: #20352f;
            border-color: var(--accent);
            color: var(--accent);
        }

        /* CURRENT TOURNAMENT */

        .tournament-panel {
            flex: 0 0 auto;
        }

        .tournament-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px;
        }

        .tournament-name {
            font-size: 17px;
            font-weight: bold;
        }

        .tournament-description {
            margin-top: 5px;
            color: var(--muted);
            font-size: 12px;
        }

        .join-button {
            min-width: 90px;
        }

        /* LEADERBOARD */

        .leaderboard-panel {
            flex: 1;
            min-height: 0;
        }

        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player {
            display: grid;
            grid-template-columns: 35px minmax(0, 1fr) 55px 44px 75px;
            align-items: center;
            gap: 10px;

            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .player-header {
            background: transparent;
            border: none;
            padding: 4px 10px;
            color: var(--muted);
            font-size: 11px;
        }

        .standing {
            font-weight: bold;
            text-align: center;
            color: var(--accent);
        }

        .player-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            font-weight: bold;
        }

        .elo {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #354254;
            border: 1px solid #63778c;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .coins {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
            color: var(--accent);
            font-size: 12px;
            font-weight: bold;
        }

        .coin-icon {
            font-size: 15px;
        }

        @media (max-width: 450px) {
            .player {
                grid-template-columns: 28px minmax(0, 1fr) 43px 36px 58px;
                gap: 6px;
                padding: 8px 6px;
            }

            .avatar {
                width: 32px;
                height: 32px;
            }

            .player-name {
                font-size: 12px;
            }

            .elo, .coins {
                font-size: 11px;
            }

            .tournament-tabs button {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Tournaments</h1>
        <div class="status" id="connection-status">DISCONNECTED</div>
        <button class="primary" id="menu">Back to menu</button>
    </header>

    <main class="tournaments">

        <!-- TABS -->

        <div class="tournament-tabs">
            <button class="active" data-tab="current">CURRENT</button>
            <button data-tab="others">OTHERS</button>
            <button data-tab="finished">RECENTLY FINISHED</button>
        </div>

        <!-- CURRENT TOURNAMENT -->

        <section class="panel tournament-panel">
            <div class="tournament-info">
                <div>
                    <div class="tournament-name" id="tournamentName">
                        --
                    </div>
                    <div class="tournament-description">
                        -- · -- · --
                    </div>
                </div>

                <button class="primary join-button" id="joinTournament">
                    JOIN
                </button>
            </div>
        </section>

        <!-- LEADERBOARD -->

        <section class="panel leaderboard-panel">

            <div class="panel-header">
                <h2>Players</h2>
                <span class="status">--</span>
            </div>

            <div class="panel-content">
                <div class="leaderboard">
                    <!--div class="player">
                        <span class="standing">10</span>
                        <span class="player-name">CheckmateX</span>
                        <span class="elo">1750</span>
                        <div class="avatar"></div>
                        <span class="coins"><span class="coin-icon">🪙</span> 2,400</span>
                    </div-->
                </div>
            </div>
        </section>
    </main>
    <script src="js/tournaments.js"></script>
    <script>
        document.querySelectorAll(".tournament-tabs button")
            .forEach(button => {
                button.addEventListener("click", () => {
                    document.querySelectorAll(".tournament-tabs button")
                        .forEach(b => b.classList.remove("active"));

                    button.classList.add("active");
                });
            });

        document.getElementById("joinTournament")
            .addEventListener("click", () => {
                console.log("Join tournament clicked");
            });
    </script>

</body>
</html>
